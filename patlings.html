<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a id="patlink" href="index.html">← Back to DNA Quotes</a>
    </nav>

    <h1 id="title">Patlings Quote Generator</h1>

    <div class="container">
      <div class="quote-container">
        <p id="quote">Click the button to generate quote</p>
      </div>
      <button id="btn">Generate Quote</button>
      <p>
        <span id="viewPhoto" class="view-photo">View Photo</span>
      </p>
    </div>

    <div id="popup" class="popup">
        <span id="close">&times;</span>
        <img id="popup-img" src="" alt="Quote Image">
    </div>

    <script src="script-2.js"></script>
  </body>
</html>
